services:
  havencloud:
    image: tang0225/havencloud:latest
    container_name: HavenCloud
    restart: unless-stopped
    ports:
      - "8100:8080"
    environment:
      - TZ=Asia/Shanghai
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
